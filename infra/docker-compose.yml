# Local development / management-plane stack. No packet capture, no inline prevention, no
# privileged containers. Sensors are deployed separately (see infra/sensor/).
name: noc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: noc_dev
      POSTGRES_USER: noc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    command: ['postgres', '-c', 'shared_buffers=256MB', '-c', 'log_min_duration_statement=500']
    volumes:
      - noc_pgdata:/var/lib/postgresql/data
      - ./postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noc -d noc_dev']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--save',
        '60',
        '1',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    volumes:
      - noc_redis:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    profiles: ['app']
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgres://noc:${POSTGRES_PASSWORD}@postgres:5432/noc_dev
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - '127.0.0.1:4000:4000'
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    profiles: ['app']
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      NEXT_PUBLIC_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
    depends_on: [api]
    ports:
      - '127.0.0.1:3000:3000'
    read_only: true
    tmpfs: ['/tmp', '/srv/apps/web/.next/cache']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

  analysis:
    build: { context: ../services/analysis }
    profiles: ['app']
    restart: unless-stopped
    environment:
      ANALYSIS_ENVIRONMENT: production
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?set ANALYSIS_INTERNAL_TOKEN in .env}
    ports:
      - '127.0.0.1:8000:8000'
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

volumes:
  noc_pgdata:
  noc_redis:
