[project]
name = "noc-sensor-agent"
version = "0.1.0"
description = "Reference sensor agent: enrols a Suricata host, ships EVE, applies rule bundles and the inline-prevention directive honestly."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
noc-sensor-agent = "agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
